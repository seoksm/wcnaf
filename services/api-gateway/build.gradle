        println("██║███╗██║██║██║╚██╗██║██║   ██║   ██╔══╝  ██║     ██╔══██║")
        println("╚███╔███╔╝██║██║ ╚████║██║   ██║   ███████╗╚██████╗██║  ██║")
        println("╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═╝   ╚═╝   ╚══════╝ ╚═════╝╚═╝  ╚═╝")
        println("\n" + "=".repeat(80))
        println("🚨  알림 🚨")
