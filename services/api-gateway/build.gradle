plugins {
    id 'org.springframework.boot' version '2.5.8'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'com.google.cloud.tools.jib' version '2.8.0'
    id 'org.openapi.generator' version "6.6.0"
    id 'java'
}
ext['tomcat.version'] = '9.0.115'

group = 'com.winitech.cto.wini_dev_portal'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

var serviceName = 'apiGateway'
var egovframeVersion = '4.3.0'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.egovframe.go.kr/maven/' }
}

ext {
    set('springCloudVersion', "2020.0.2")
}

configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'org.slf4j', module: 'jcl-over-slf4j'
    exclude group: 'org.slf4j', module: 'log4j-over-slf4j'
    exclude group: 'org.slf4j', module: 'jul-to-slf4j'
}

dependencies {
    // eGovFrame
    implementation "org.egovframe.rte:org.egovframe.rte.ptl.mvc:${egovframeVersion}"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.cmmn:${egovframeVersion}"
    implementation "org.egovframe.rte:org.egovframe.rte.psl.dataaccess:${egovframeVersion}"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.logging:${egovframeVersion}"

    //implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    
    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.4.2.Final'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.4.2.Final"
    annotationProcessor(
            'org.projectlombok:lombok',
            'org.projectlombok:lombok-mapstruct-binding:0.1.0'
    )
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 버전을 직접 고정하지 않는다 - Spring Boot의 io.spring.dependency-management 플러그인이
    // 관리하는 BOM 버전(패치 포함)을 그대로 쓴다. 과거 명시적 버전 고정 때문에 jackson-databind
    // 2.12.3(CVE-2022-42003/42004 StackOverflow DoS 미패치)/postgresql 42.2.23/logback-classic
    // 1.2.3(CVE-2021-42550)/guava 28.2-jre(CVE-2023-2976)가 BOM보다 오래된 버전으로 굳어 있었다.
    implementation 'com.google.guava:guava'
    implementation 'org.apache.commons:commons-lang3:3.9'

    // DB 설정
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    // Log 설정
    implementation 'ch.qos.logback:logback-classic'
    implementation 'net.logstash.logback:logstash-logback-encoder:6.6'
    implementation 'org.slf4j:log4j-over-slf4j:1.7.13'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'org.springframework.boot:spring-boot-starter-integration'
    implementation 'org.springframework.integration:spring-integration-ip'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // MyBatis 설정 중 winitech.mybatis.use-auto-mapper-refresh = true로 사용시 오류를 야기하므로 주석처리 함
    // developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // QueryDsl
    implementation 'com.querydsl:querydsl-jpa:4.4.0'
    annotationProcessor("com.querydsl:querydsl-apt:4.4.0:jpa")

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    annotationProcessor('javax.annotation:javax.annotation-api:1.3.2')
    
    // API Gateway
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation' // NotE
    implementation 'org.springframework.kafka:spring-kafka'
    implementation group: 'io.springfox', name: 'springfox-boot-starter', version: '3.0.0' // Boot 2.6 지원 안함
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'

    // Flyway
    implementation 'org.flywaydb:flyway-core:7.15.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}

['openApiGenerate', 'openApiGenerators', 'openApiMeta', 'openApiValidate'].each { taskName ->
    tasks.named(taskName) {
        group = null
        description = null
    }
}

// *apiSpec.yaml 파일 기반 controller 생성
def openApiGeneratorTasks = []

new File("$rootDir/src/main/resources/".toString()).eachFileRecurse(groovy.io.FileType.FILES) { file ->
    if (! file.getName().endsWith("apiSpec.yaml")) {
        return
    }

    def fileName = file.getName()
    def apiName = fileName.replace("_apiSpec.yaml", "").replace("apiSpec.yaml", "")

    def task = tasks.create("openApiGenerate_" + apiName, org.openapitools.generator.gradle.plugin.tasks.GenerateTask.class, {
        group = "openapi tools"
        configFile = "$projectDir/../../extras/openApi/config/spring.yaml"
        inputSpec = "$projectDir/src/main/resources/$fileName"
        outputDir = "$projectDir"
        apiPackage = "com.winitech.${serviceName}.interfaces.inboundAdapter.spec"
        modelPackage = "com.winitech.${serviceName}.interfaces.inboundAdapter.spec"
        templateDir = "$projectDir/../../extras/openApi/templates/spring"
        additionalProperties = [
                serviceName: serviceName,
                useTags    : "true",
        ]
    })

    openApiGeneratorTasks.add(task)
}

tasks.register("generateAllOpenApiSpecs") {
