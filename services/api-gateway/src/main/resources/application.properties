#-----------------------------------------------------------------------
#   application.properties : 일반 설정
#-----------------------------------------------------------------------
#   1.  key = value 구조입니다.
#   2.  key값은 공백문자를 포함불가, value값은 공백문자를 가능
#   3.  key값으로 한글을 사용불가,   value값은 한글사용이 가능
#   4.  줄을 바꿀 필요가 있으면 '\'를 라인의 끝에 추가(만약  '\'문자를 사용해야 하는 경우는 '\\'를 사용)
#   5.  Windows에서의 디렉토리 표시 : '\\' or '/'  ('\' 사용하면 안됨)
#   6.  Unix에서의 디렉토리 표시 : '/'
#   7.  주석문 처리는  #사용
#   8.  value값 뒤에 스페이스가 존재하는 경우 서블릿에서 참조할때는 에러발생할 수 있으므로 trim()하거나 마지막 공백없이 properties 값을 설정할것
#-----------------------------------------------------------------------
spring.profiles.active=${ACTIVE:local}
management.endpoints.web.exposure.include=health,info,apiGatewayInfo

# 기본적인 설정은 common에서 기본설정을 불러옵니다.
# 전체 설정 목록을 알고 싶다면 common/src/main/resources/config/default-application.properties를 참고하세요.
winitech.service-name=api-gateway

#-----------------------------------------------------------------------
# Kafka 설정
#-----------------------------------------------------------------------
# CommonUser CDC Consumer 사용 여부
winitech.cdc.common.common-user.use-consumer = true
# 권한관련 CDC Consumer 사용 여부 (CommonAuthorizationGroupPermission, CommonAuthorizationGroupUser, CommonMenuAction)
winitech.cdc.common.common-authorization.use-consumer = true
# 권한관련 Entity를 common entity로 사용할지 여부 (system 서비스 또는 MSA가 아닌 경우 false하고 자체 제공)
winitech.cdc.common.common-authorization.use-common-entity = true

#-----------------------------------------------------------------------
# Mybatis 설정
#-----------------------------------------------------------------------
winitech.mybatis.enabled = false
winitech.mybatis.config-location=classpath:/egovframework/mapper/config/mapper-config.xml
winitech.mybatis.mapper-locations=classpath:/egovframework/mapper/winitech/**/*.xml
# SQL xml 수정시 서비스 재시작없이 적용 사용 여부
winitech.mybatis.use-auto-mapper-refresh=false
# SQL xml 수정시 리프레시 주기
winitech.mybatis.use-auto-mapper-refresh-interval-in-ms=500

#-----------------------------------------------------------------------
# Quartz 설정
#-----------------------------------------------------------------------
# Quartz 자동 시작 여부
spring.quartz.auto-startup = true
# Quartz 작업 스케줄러 저장소 : jdbc (물리테이블 생성), memory
spring.quartz.jdbc.initialize-schema = never
# 별도 DB를 사용하고 싶을때는 아래와 같이 별도 설정 추가
# org.quartz.jobStore.dataSource = quartzDS
# org.quartz.dataSource.quartzDS.driver = org.postgresql.Driver
# org.quartz.dataSource.quartzDS.URL = jdbc:postgresql://localhost:5432/quartz
# org.quartz.dataSource.quartzDS.user = 아이디
# org.quartz.dataSource.quartzDS.password = 비밀번호

# Spring MVC? Spring WebFlux? 중 선택이며 게이트웨이는 WebFlux로 선택해야 함
spring.main.web-application-type = REACTIVE

spring.kafka.listener.ack-mode=manual