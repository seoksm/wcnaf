basePackage: "com.winitech.apiGateway"

example:
  eventName:
    description: 설명
    topic: 토픽
    domain: 도매인
    broker: kafka (현재 카프카만지원)
    dto:
      - name: "int변수명"
        type: "Integer"
      - name: "문자열리스트변수명"
        type: "List<String>"
      - name: "enum변수명"
        type: "enum"
        enumClass:
          name: "enum명"
          constants:
            - name: "s"
              value: "sync"
      - name: "커스텀 enum변수명"
        type: "enum"
        enumClass:
          path: "com.winitech.apiGateway.interfaces.inboundAdapter.eventListener.common.TEST_ENUM"
      - name: "리스트변수명"
        type: "list"
        items:
          - name: "test"
            type: "Long"
            example: "24321"
      - name: "객체변수명"
        type: "object"
        items:
          - name: "test"
            type: "Long"
      - name: "koko"
        useObj: "ObejctName"
  eventName2:
    description: 설명
    topic: 토픽
    domain: 도매인
    broker: kafka (현재 카프카만지원)
    useObj: ObejctName

obj:
  ObejctName:
    name: ObjectName
    domain: common
    dto:
      - name: "intval"
        type: "Integer"
      - name: "stringval"
        type: "List<String>"
      - name: "gg"
        type: "enum"
        enumClass:
          name: "enum명"
          constants:
            - name: "s"
              value: "sync"
      - name: "kk"
        type: "enum"
        enumClass:
          path: "com.winitech.apiGateway.interfaces.inboundAdapter.eventListener.common.TEST_ENUM"
          constants:
            - name: "s"
              value: "sync"

sub:
  CommonAuthorizationDataEvent:
    description: 공통권한데이터변경
    topic: wini.fct.common.v1.common-authorization-data-change
    domain: common
    broker: kafka
    dto:
      - name: "op"
        type: "enum"
        enumClass:
          name: "OPERATION"
          constants:
            - name: "s"
              value: "sync"
      - name: "ts_ms"
        type: "Integer"
      - name: "message"
        type: "String"
  RouteChangeEvent:
    description: 라우트변경
    topic: wini.fct.api-gateway.v1.route-change
    domain: route
    broker: kafka
    dto:
      - name: "ts_ms"
        type: "Integer"
  UserSessionBlockEvent:
    description: 세션블락이벤트
    topic: wini.fct.common.v1.common-user-token-block
    domain: userSessionBlock
    broker: kafka
    dto:
      - name: "op"
        type: "enum" # 💡 Enum 타입을 판별하기 위한 플래그
        enumClass:
          name: "OPERATION"
          constants:
            - name: "s"
              value: "sync"
      - name: "ts_ms"
        type: "Integer"
      - name: "userSessionId"
        type: "UUID"
      - name: "accessTokenExpiresAt"
        type: "OffsetDateTime"
      - name: "userId"
        type: "UUID"
pub:
  RouteChangeEvent:
    description: 라우팅변경전달
    topic: wini.fct.api-gateway.v1.route-change
    domain: route
    broker: kafka
    dto:
      - name: "ts_ms"
        type: "Integer"