//tasks.named('test') {
//    useJUnitPlatform()
//}
bootJar {
    enabled = false
}

jar {
    enabled = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    
    repositories {
        maven {
            def dummyUrl = "http://dummy.not-existing-domain.kr/"

            def releasesRepoUrl = uri(project.findProperty("repoUrl") ?: dummyUrl)
            def snapshotsRepoUrl = uri(project.findProperty("repoSnapshotUrl") ?: releasesRepoUrl)
            
            if (project.gradle.startParameter.taskNames.contains('publish')) {
                if (releasesRepoUrl.toString() == dummyUrl) {
                    throw new GradleException("ERROR: You are using a dummy URL for the repository. Please set 'repoUrl' and 'repoSnapshotUrl' project properties. (`gradle.properties` file)")
                }

                url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl

                credentials {
                    username = project.findProperty("repoUsername") ?: ""
                    password = project.findProperty("repoPassword") ?: ""
                }
            }
        }
    }
}
