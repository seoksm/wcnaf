#-----------------------------------------------------------------------
# 톰캣 및 스프링 설정
#-----------------------------------------------------------------------
server.port=8092
management.endpoints.web.exposure.include=health,info

#-----------------------------------------------------------------------
# DB 접속정보 설정
#-----------------------------------------------------------------------
spring.datasource.username=CHANGEME
spring.datasource.password=CHANGEME
spring.datasource.url=jdbc:postgresql://localhost:1234/CHANGEME
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3

# 초기 Seed 데이터를 넣는 data.sql을 resources/data-${spring.sql.init.platform}.sql 파일을 실행하려면 주석해제
spring.sql.init.platform=postgresql
# resources/data.sql 파일을 실행하려면 주석해제
#spring.sql.init.mode=always

#-----------------------------------------------------------------------
# JPA 설정
#-----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=false
spring.jpa.properties.hibernate.format_sql=true
# 배치 Insert/Update
spring.jpa.properties.hibernate.jdbc.batch_size=500
# 동일한 Entity의 Insert문을 그룹화해서 배치로 전송할지 여부 지정
# 성능 최적화에는 도움이 될 수 있으나 논리적인 오류 발생 가능성이 있음
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#spring.jpa.properties.hibernate.batch_versioned_data=true

#-----------------------------------------------------------------------
# 인가 관련 설정
#-----------------------------------------------------------------------
# 인가 기능 사용
#       off         : 끄기
#       on          : 켜기
#       silent      : 실패시 로그만 남김
#       api-gateway :  
winitech.security.authorization.mode = on

#-----------------------------------------------------------------------
# Kafka 설정
#-----------------------------------------------------------------------
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.properties.security.protocol=PLAINTEXT
spring.kafka.listener.log-container-config=false
spring.kafka.properties.sasl.mechanism=PLAIN

# CommonUser CDC Consumer 사용 여부
winitech.cdc.common.common-user.use-consumer = true
# 권한관련 CDC Consumer 사용 여부 (CommonAuthorizationGroupPermission, CommonAuthorizationGroupUser, CommonMenuAction)
winitech.cdc.common.common-authorization.use-consumer = true
# 권한관련 Entity를 common entity로 사용할지 여부 (system 서비스 또는 MSA가 아닌 경우 false하고 자체 제공)
winitech.cdc.common.common-authorization.use-common-entity = true
winitech.cdc.common.topic.prefix = wini.cdc.

winitech.kafka.topic.prefix = wini.

#-----------------------------------------------------------------------
# 파일업로드 설정
#-----------------------------------------------------------------------
winitech.file.tmp-zip-dir=
winitech.file.upload.image.extensions = bmp,gif,jpg,jpeg,png
winitech.file.upload.image.max-size = 10485760
winitech.file.upload.extensions = bmp,gif,jpg,jpeg,png,xls,xlsx,doc,docx,ppt,pptx,hwp,hwpx,pdf,mp4,zip,7z,rar,alz,egg
winitech.file.upload.max-size = 104857600
winitech.file.base-dir = d:/data/wini-dev-portal/upload
winitech.file.cache.image-dir = d:/data/wini-dev-portal/cache/image
# 파일 읽기/쓰기시 사용할 수 있는 경로 목록. WiniFile.filePathBlackList로 체크시 아래의 경로에서 벗어나는 경우 에러 발생
winitech.file.sandboxs = d:/data\wini-dev-portal,d:/data/sandbox

winitech.file.download.multidownload.max-size = 104857600
winitech.file.download.multidownload.max-count = 100

cloud.aws.credentials.accessKey=
cloud.aws.credentials.secretKey=
cloud.aws.s3.bucket=
#cloud.aws.s3.customEndpoint=
cloud.aws.region.static=

#-----------------------------------------------------------------------
# Excel 설정
#-----------------------------------------------------------------------
winitech.excel.template-dir=d:/data/wini-dev-portal/excel-template/

#-----------------------------------------------------------------------
# 로그인 관련 설정
#-----------------------------------------------------------------------
winitech.security.login.lock-count = 5
winitech.security.login.lock-duration-in-seconds = 300
winitech.security.login.password.expires-in-days = 180

# 중복 로그인 허용 여부
winitech.security.login.allow-duplicate-login = false
# IP 보안 기능 강제 여부 (false이면 로그인시 IP 보안 기능을 사용할지 여부 지정)
winitech.security.login.force-ip-security = false

winitech.security.password.history.keep-count = 2
winitech.security.password.history.reuse-prevent-count = 5

winitech.security.jwt.pbkdf2.iterations=100
winitech.security.jwt.pbkdf2.salt=8

# 값 자체는 여기에 두지 않는다 - 환경변수 WINITECH_JWT_SECRET로만 전달한다. Base64 디코드 후
# 32바이트 미만/미설정이면 WiniSecurity 기동 시 즉시 실패한다. 예: openssl rand -base64 64
winitech.security.jwt.secret=${WINITECH_JWT_SECRET:}
winitech.security.jwt.issuer=winitech
# JWT 만료 시간 지정
winitech.security.jwt.expires-in-seconds=14400
# JWT 만료 후 갱신가능한 시간 지정 (예) 3600이면 만료이후 1시간 동안 갱신가능) 0이면 무제한.
winitech.security.jwt.refresh-timeout-in-seconds=0

winitech.security.refresh-token.length = 108
# refresh token 만료 시간 지정 (rotate 되어도 변하지 않음)
winitech.security.refresh-token.expires-in-seconds = 2592000
winitech.security.refresh-token.rotation.access-token-refresh-cnt = 180
winitech.security.refresh-token.rotation.threshold-in-seconds = 86400

#-----------------------------------------------------------------------
# 보안 설정
#-----------------------------------------------------------------------
winitech.security.cors.origins=*
# Load Balancer 등을 사용하는 경우 실제 IP를 가져오기위한 헤더 목록 설정. (콤마로 구분) 꼭 필요한것만 추가할것 (사용자가 조작할 위험 있음)
winitech.security.forward-ip-headers=X-Forwarded-For,HTTP_X_FORWARDED_FOR
# winitech.security.forward-ip-headers=X-Forwarded-For,HTTP_X_FORWARDED_FOR,REMOTE_ADDR,Proxy-Client-IP,WL-Proxy-Client-IP,HTTP_CLIENT_IP,X-Real-IP,X-RealIP
winitech.security.use-restapi-encryption=false
winitech.security.use-restapi-response-encryption=false

winitech.security.api-gateway.use-magic-header=true
winitech.security.api-gateway.magic-header=x-wini-api-gateway
# 값 자체는 여기에 두지 않는다 - 환경변수 WINITECH_API_GATEWAY_MAGIC_HEADER_SECRET로만 전달한다
# (32바이트 미만/미설정이면 기동 실패). 예: openssl rand -base64 48
winitech.security.api-gateway.magic-header-secret=${WINITECH_API_GATEWAY_MAGIC_HEADER_SECRET:}

#-----------------------------------------------------------------------
# 멀티테넌트 설정
#-----------------------------------------------------------------------
# 기본 테넌트 ID (일부 기능들은 멀티테넌트에서는 작동 하지 않아서 체크하는 용도)
winitech.multitenant.default-tenant-id = 00000000-0000-0000-0000-000000000000
# 멀티테넌트 방식 설정 : database (데이터베이스), schema (스키마 - postgresql만 지원), row (행단위 - 미구현), 기타 (미사용)
winitech.multitenant.type = none
# 멀티테넌트 방식이 database 일 때 데이터베이스 접두사
winitech.multitenant.database.prefix = tenant-
# 멀티테넌트 방식이 database 일 때 connection pool 정리 시도 주기 (초)
winitech.multitenant.database.pool-cleanup-interval-in-seconds = 60
# 멀티테넌트 방식이 database 일 때 지정된 시간 이상 사용되지 않으면 connection pool 삭제 (초)
winitech.multitenant.database.pool-cleanup-idle-in-seconds = 300 
# 멀티테넌트 방식이 schema 일 때 스키마 접두사
winitech.multitenant.schema.prefix = tenant-
# 멀티테넌트 방식이 schema 일 때 공유 스키마 이름 (테넌트 스키마에 테이블이 없는 경우 찾아갈 스키마)
# 지정하지 않는 경우 해당 스키마에 없으면 테이블 없음 에러 처리
winitech.multitenant.schema.shared-schema =
# CommonUser CDC Consumer 사용 여부
winitech.multitenant.cdc.common.common-user.use-consumer = true


#-----------------------------------------------------------------------
# DB Migration 설정
#-----------------------------------------------------------------------
# DB Migration 기능 사용 여부
winitech.database.migration.enabled = false
# DB Migration 소스 설정 : git (미구현 : filesystem, ftp, sftp, db, ...)
winitech.database.migration.source-type = git
# DB Migration 소스 url (파일시스템인 경우 디렉토리 경로)
winitech.database.migration.source-url = https://github.com/foo/bar.git
# DB Migration 소스 디렉토리 (파일시스템인 경우)
winitech.database.migration.source-directory = migrations
# DB Migration 소스 브랜치 (git인 경우)
winitech.database.migration.source-branch = main
# DB Migration 소스 아이디 (git, ftp, sftp인 경우)
winitech.database.migration.source-username = CHANGEME
# DB Migration 소스 비밀번호 (git, ftp, sftp인 경우)
winitech.database.migration.source-password = CHANGEME
# DB Migration 서비스 이름 (,로 구분) (예) basic-info,auth,file-storage)
winitech.database.migration.service-names = basic-info, system-info
# DB Migration 임시 디렉토리 (상대 경로면 winitech.file.base-dir)
winitech.database.migration.tmp-dir = ./tmp/db-migration

# DB Migration 적용 대상 데이터베이스 접속 URL
winitech.database.migration.datasource.url = jdbc:postgresql://localhost:5432/CHANGEME
# DB Migration 적용 대상 데이터베이스 드라이버 클래스
winitech.database.migration.datasource.driver = org.postgresql.Driver
# DB Migration 적용 계정 아이디
winitech.database.migration.datasource.username = CHANGEME
# DB Migration 적용 계정 비밀번호
winitech.database.migration.datasource.password = CHANGEME

spring.flyway.enabled=false

#-----------------------------------------------------------------------
# Mybatis 설정
#-----------------------------------------------------------------------
winitech.mybatis.enabled = false
winitech.mybatis.config-location=classpath:/egovframework/mapper/config/mapper-config.xml
winitech.mybatis.mapper-locations=classpath:/egovframework/mapper/winitech/**/*.xml
# SQL xml 수정시 서비스 재시작없이 적용 사용 여부
winitech.mybatis.use-auto-mapper-refresh=false
# SQL xml 수정시 리프레시 주기
winitech.mybatis.use-auto-mapper-refresh-interval-in-ms=500

#-----------------------------------------------------------------------
# Quartz 설정
#-----------------------------------------------------------------------
# Quartz 스케줄러 이름
spring.quartz.scheduler-name = WiniJobScheduler
# Quartz 자동 시작 여부
spring.quartz.auto-startup = false
# Quartz 작업 스케줄러 저장소 : jdbc (물리테이블 생성), memory
spring.quartz.job-store-type = jdbc
# Quartz 관련 테이블 초기화 여부 : always (매번 초기화), never (초기화 하지 않음), embedded (메모리에만 생성)
spring.quartz.jdbc.initialize-schema = never
# 시작시의 부하를 줄이기 위해서 30초 뒤에 스케줄러 시작
spring.quartz.startup-delay = 30
# 테이블 생성시 테이블명 접두사
#spring.quartz.properties.org.quartz.jobStore.tablePrefix=qrtz_
#spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

## if you want to use multitenant-aware job store
#spring.quartz.properties.org.quartz.jobStore.class = com.winitech.common.library.core.QuartzMultitenantAwareJobStore

# 클러스터 설정
#spring.quartz.properties.org.quartz.scheduler.instanceId = AUTO
#spring.quartz.properties.org.quartz.jobStore.isClustered = true
#spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval = 10000

## if you want to use multitenant-aware job store
#spring.quartz.properties.org.quartz.jobStore.dontSetAutoCommitFalse = false

#-----------------------------------------------------------------------
# 기타 설정
#-----------------------------------------------------------------------
spring.jackson.serialization.INDENT_OUTPUT = false

spring.autoconfigure.exclude=org.springframework.cloud.aws.autoconfigure.context.ContextInstanceDataAutoConfiguration, \
  org.springframework.cloud.aws.autoconfigure.context.ContextStackAutoConfiguration, \
  org.springframework.cloud.aws.autoconfigure.context.ContextRegionProviderAutoConfiguration

# K 타임존 처리 사용 여부 - true이면 K 타임존 처리 사용
# ※ 브라우저와 서버, DB의 시간대가 KST라고 가정함. JSON Serialize시 KST로 리턴되고 timezone 표시 생략
# !!경고!! 브라우저와 서버, DB 시간대가 KST가 아닌 경우 저장/조회시 잘못된 시간이 사용될 수 있음
winitech.config.use-k-timezone = false

#-----------------------------------------------------------------------
# Environmental Variable
#-----------------------------------------------------------------------
wini.env.hostname = ${HOSTNAME:HOSTNAME}

#-----------------------------------------------------------------------
# 로그 설정
#-----------------------------------------------------------------------
winitech.log.show-stacktrace = false
winitech.log.show-full-stacktrace = false

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
#to show sql
spring.jpa.properties.hibernate.show_sql=false
#printing parameter values in order
logging.level.org.hibernate.type.descriptor.sql=off

# [log4jdbc] jdbc 동작 상세 로그
logging.level.jdbc.audit=off
# [log4jdbc] resultset 상세 로그
logging.level.jdbc.resultset=off
# [log4jdbc] 쿼리 로그
logging.level.jdbc.sqlonly=off
# [log4jdbc] 쿼리 + 소요시간 로그
logging.level.jdbc.sqltiming=info
# [log4jdbc] 연결/연결해제 로그
logging.level.jdbc.connection=off
# [log4jdbc] 쿼리결과를 테이블 형태로 보여줌
logging.level.jdbc.resultsettable=info

winitech.database.all-exception-rollback=false

error.code.msg=saas
# 값 자체는 여기에 두지 않는다 - 환경변수 WINITECH_ENC_PRIVATE_KEY로만 전달한다(RSA PKCS8 Base64).
# 미설정이거나 유효한 RSA 개인키로 파싱되지 않으면 CommonEncServiceImpl 기동 시 즉시 실패한다.
winitech.enc.private.key=${WINITECH_ENC_PRIVATE_KEY:}