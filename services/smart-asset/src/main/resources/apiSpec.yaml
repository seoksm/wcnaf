      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
    DashboardMonthlyCostDto:
      type: object
      properties:
        month:
          type: string
          format: date
        rentalAmount:
          type: number
        licenseAmount:
          type: number
    DashboardExpiringSoonDto:
      type: object
      properties:
        within7Days:
          type: integer
          format: int64
        within30Days:
          type: integer
          format: int64
        within90Days:
          type: integer
          format: int64
        items:
