      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /inventory-result/{inventoryTargetId}/anomaly:
    patch:
      tags:
        - Inventory
      summary: 관리자 대체 이상 보고
      operationId: adminReportInventoryAnomaly
      description: 위 확인 처리와 동일한 이유의 임시 경로로 이상(파손·위치불일치·타인보유 등)을 기록합니다.
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryResultAnomalyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /inventory-result/{inventoryTargetId}/close:
    patch:
      tags:
        - Inventory
      summary: 미확인 자산 종결 처리 (1건)
      operationId: closeInventoryResult
      description: 조사 종료 전 미확인 항목을 차기이월/소재확인/분실 중 하나로 처리합니다. (S-308)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryResultCloseRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
