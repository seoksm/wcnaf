      operationId: rejectInventoryResult
      description: 승인대기 상태를 미확인으로 되돌립니다(I5). (S-304)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryResultRejectRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
