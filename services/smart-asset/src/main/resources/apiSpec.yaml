    # Dashboard DTO 목록
    ##########################
    DashboardSummaryResponseDto:
      type: object
      properties:
        aggregatedAt:
          type: string
          format: date-time
          description: 이 응답을 계산한 시각 (D7 - 미확정 기간은 매 요청 재계산됨을 화면에 표기)
        assetSummary:
          $ref: '#/components/schemas/DashboardAssetSummaryDto'
        categoryDistribution:
          type: array
          items:
            $ref: '#/components/schemas/DashboardNameCountDto'
        locationDistribution:
          type: array
          items:
            $ref: '#/components/schemas/DashboardNameCountDto'
        statusDistribution:
          type: array
          items:
            $ref: '#/components/schemas/DashboardNameCountDto'
        monthlyCostTrend:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMonthlyCostDto'
        expiringSoon:
          $ref: '#/components/schemas/DashboardExpiringSoonDto'
        ticketStatus:
          $ref: '#/components/schemas/DashboardTicketStatusDto'
        loanStatus:
          $ref: '#/components/schemas/DashboardLoanStatusDto'
        inventoryProgress:
          type: array
          items:
            $ref: '#/components/schemas/DashboardInventoryProgressDto'
        licenseConsistency:
          $ref: '#/components/schemas/DashboardLicenseConsistencyDto'
    DashboardAssetSummaryDto:
      type: object
      properties:
        assetCount:
          type: integer
          format: int64
        totalAcquisitionAmount:
          type: number
        totalAccumulatedDepreciation:
          type: number
        totalBookValue:
          type: number
        confirmed:
          type: boolean
          description: true면 결산 확정된 분기의 스냅샷 값(고정), false면 실시간 산출값(D7)
        basedOn:
          type: string
          format: date-time
          description: 확정 시각(confirmed=true) 또는 산출 시각(confirmed=false)
