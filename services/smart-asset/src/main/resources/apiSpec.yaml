      operationId: closeInventoryResultsBulk
      description: 여러 건을 한 번에 처리합니다. 분실(LOST)은 일괄 처리에서 제외됩니다(R6). (S-308)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryResultCloseBatchRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
