    patch:
      tags:
        - Inventory
      summary: 라벨 없음/훼손 - 사진으로 확인
      operationId: selfConfirmInventoryResultWithoutScan
      description: I3 예외 경로 - 라벨이 없거나 훼손돼 스캔이 불가능한 경우, 목록에서 직접 선택하고 사진으로 확인합니다. 항상 승인대기가 됩니다. (S-311)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySelfConfirmPhotoRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
