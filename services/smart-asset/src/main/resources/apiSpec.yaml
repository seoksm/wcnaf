openapi: "3.0.3"
info:
  title: API Title
  version: "1.0"
servers:
  - url: https://api.server.test/api/v1
tags:
  - name: AssetCategory
    description: 자산 종류 관리 (S-200)
  - name: AssetLocation
    description: 자산 위치 관리 (S-201)
  - name: TangibleAsset
    description: 유형자산 관리 (S-210~212)
  - name: Depreciation
    description: 감가상각 (S-230~232)
  - name: ProcessConfig
    description: 프로세스 설정 (S-400)
  - name: Loan
    description: 대여 관리 (S-410~412,420,421)
  - name: AckTemplate
    description: 확인서 문구 관리 (S-433)
  - name: Acknowledgement
    description: 수령·반납 승인 (S-430~432,440)
  - name: IntangibleAsset
    description: 무형자산 (S-500~502)
  - name: Rental
    description: 렌탈·구독 (S-510~512)
  - name: Software
    description: 소프트웨어 마스터 (S-520)
  - name: License
    description: 라이선스 관리 (S-530~533,550)
  - name: Vendor
    description: 공급사 관리 (S-540)
  - name: Ticket
    description: 서비스데스크 (S-600~603,610,611)
  - name: Dashboard
    description: 대시보드 (S-700,701)
paths:
  ##########################
  # Depreciation
  ##########################
  /depreciation:
    get:
      tags:
        - Depreciation
      summary: 감가상각 현황 조회
      operationId: searchDepreciationStatus
      description: 특정 회계연도·누적분기의 자산별 상각 현황과 총액법 요약을 조회합니다. (S-230)
      parameters:
        - name: fiscalYear
          required: true
          in: query
          schema:
            type: integer
        - name: quarter
          required: true
          in: query
          description: 누적 분기 (Q1=1~3월, Q2=1~6월, Q3=1~9월, Q4=1~12월)
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepreciationStatusResponseDto'
  /depreciation/confirm:
    patch:
      tags:
        - Depreciation
      summary: 결산 확정
      operationId: confirmDepreciation
      description: 해당 회계연도·분기의 산출 결과를 스냅샷으로 고정합니다. 이미 확정된 기간은 먼저 해제해야 합니다. (S-232, D7)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepreciationConfirmRequestDto'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /depreciation/release:
    patch:
      tags:
        - Depreciation
      summary: 결산 확정 해제
      operationId: releaseDepreciation
      description: 확정을 해제하고 해당 기간을 다시 실시간 산출로 되돌립니다. (S-232)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepreciationReleaseRequestDto'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /depreciation/confirmation-log:
    get:
      tags:
        - Depreciation
      summary: 확정·해제 이력 조회
      operationId: searchDepreciationConfirmationLog
      description: 결산 확정·해제 이력을 최신순으로 조회합니다. (S-232)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepreciationConfirmationResponseDto'
  /tangible-asset/{tangibleAssetId}/depreciation-schedule:
    get:
      tags:
        - Depreciation
      summary: 자산별 상각 스케줄 조회
      operationId: searchTangibleAssetDepreciationSchedule
      description: 자산 1건의 해당 회계연도 4개 분기 상각 스케줄을 조회합니다. (S-231)
      parameters:
        - name: tangibleAssetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
        - name: fiscalYear
          required: true
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepreciationScheduleRowResponseDto'
  ##########################
  # TangibleAsset
  ##########################
  /tangible-asset:
    get:
      tags:
        - TangibleAsset
      summary: 유형자산 목록 조회
      operationId: searchAllTangibleAsset
      description: >-
        유형자산 목록을 페이지 단위로 조회합니다. page는 0부터 시작하며, size는 기본 20/최대 200으로
        제한됩니다. sort는 "필드,방향"(예: assetName,asc) 형식이며 허용 필드는
        assetCode/assetName/acquisitionDate/acquisitionAmount/createAt(기본값, desc)입니다.
      parameters:
        - name: keyword
          required: false
          in: query
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: 0부터 시작하는 페이지 번호 (기본값 0)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          required: false
          in: query
          description: 페이지당 건수 (기본값 20, 최대 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: sort
          required: false
          in: query
          description: '"필드,방향" 형식 (예: assetName,asc). 미지정 시 createAt,desc'
          schema:
            type: string
            example: assetName,asc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TangibleAssetPageResponseDto'
    post:
      tags:
        - TangibleAsset
      summary: 유형자산 등록
      operationId: registerTangibleAsset
      description: 유형자산을 등록합니다. 자산코드는 서버에서 자동 채번합니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/{tangibleAssetId}:
    get:
      tags:
        - TangibleAsset
      summary: 유형자산 상세 조회
      operationId: searchTangibleAsset
      description: 유형자산의 상세정보를 조회합니다.
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TangibleAssetResponseDto'
    patch:
      tags:
        - TangibleAsset
      summary: 유형자산 수정
      operationId: modifyTangibleAsset
      description: 유형자산을 수정합니다. (자산코드는 수정 불가)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/{tangibleAssetId}/assignment-history:
    get:
      tags:
        - TangibleAsset
      summary: 유형자산 배정 이력 조회
      operationId: searchTangibleAssetAssignmentHistory
      description: 유형자산의 배정·회수 이력을 최신순으로 조회합니다.
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetAssignmentResponseDto'
  /tangible-asset/batch:
    patch:
      tags:
        - TangibleAsset
      summary: 유형자산 일괄 변경
      operationId: batchModifyTangibleAsset
      description: 선택한 유형자산들의 종류·위치·상태·배정을 한 번에 변경합니다. (S-215, 지정한 필드만 적용)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetBatchModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /tangible-asset/{tangibleAssetId}/duplicate:
    post:
      tags:
        - TangibleAsset
      summary: 유형자산 복제
      operationId: duplicateTangibleAsset
      description: 선택한 유형자산을 지정한 개수만큼 복제합니다. (S-214, 최대 100건, 복제본은 미배정 상태로 생성)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetDuplicateRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdsResponseDto"
  /tangible-asset/{tangibleAssetId}/history:
    get:
      tags:
        - TangibleAsset
      summary: 유형자산 변경 이력 조회
      operationId: searchTangibleAssetHistory
      description: 유형자산 1건의 변경 이력을 최신순으로 조회합니다. (S-220, 변경 필드만 diff 형태로 반환)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetHistoryResponseDto'
  /tangible-asset/activity-log:
    get:
      tags:
        - TangibleAsset
      summary: 전체 활동 로그 조회
      operationId: searchTangibleAssetActivityLog
      description: 자산 전체를 가로지르는 변경 이력을 페이지당 200건씩 조회합니다. (S-221)
      parameters:
        - name: historyType
          required: false
          in: query
          description: 이력 유형으로 필터 (REGISTER/MODIFY/STATUS_CHANGE/ASSIGNMENT 등). 비우면 전체.
          schema:
            type: string
        - name: assetCode
          required: false
          in: query
          description: 자산코드 포함 검색
          schema:
            type: string
        - name: assetName
          required: false
          in: query
          description: 자산명 포함 검색
          schema:
            type: string
        - name: fromDate
          required: false
          in: query
          description: 로그 발생시각 조회 시작 (이상)
          schema:
            type: string
            format: date-time
        - name: toDate
          required: false
          in: query
          description: 로그 발생시각 조회 종료 (이하)
          schema:
            type: string
            format: date-time
        - name: page
          required: false
          in: query
          description: 페이지 번호 (0부터 시작, 페이지당 200건). 스크롤다운 시 다음 페이지를 이어서 조회.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetHistoryResponseDto'
  /tangible-asset/{tangibleAssetId}/release:
    patch:
      tags:
        - TangibleAsset
      summary: 유형자산 배정 회수
      operationId: releaseTangibleAssetAssignment
      description: 유형자산의 현재 배정을 회수합니다. (배정 형태를 미배정으로 전환, 배정 이력 종료)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/{tangibleAssetId}/disuse:
    patch:
      tags:
        - TangibleAsset
      summary: 불용 처리
      operationId: disuseTangibleAsset
      description: 유형자산을 불용 상태로 전환합니다. 사용/보관/수리중 상태에서만 가능하며, 배정이 있으면 강제 해제됩니다. (S-241, A1)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetDisuseRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/{tangibleAssetId}/restore:
    patch:
      tags:
        - TangibleAsset
      summary: 불용 → 사용 복귀
      operationId: restoreTangibleAsset
      description: 불용 상태의 유형자산을 다시 사용 상태로 되돌립니다. 처분완료는 되돌릴 수 없습니다. (S-240, Q-28)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/{tangibleAssetId}/dispose:
    post:
      tags:
        - TangibleAsset
      summary: 처분 처리
      operationId: disposeTangibleAsset
      description: 불용 상태의 유형자산을 처분 처리합니다. 처분 시점 장부가를 고정 저장하며, 이후로는 되돌릴 수 없습니다. (S-242, Q-26, Q-28)
      parameters:
        - name: tangibleAssetId
          in: path
          description: 유형자산 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TangibleAssetDisposeRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TangibleAssetIdResponseDto"
  /tangible-asset/disposal:
    get:
      tags:
        - TangibleAsset
      summary: 불용자산 목록
      operationId: searchDisposalAssetList
      description: 불용/처분완료 자산 목록을 조회합니다. (S-240)
      parameters:
        - name: lifeStatus
          required: false
          in: query
          description: DISUSE 또는 DISPOSED로 필터. 비우면 둘 다 조회합니다.
          schema:
            type: string
            enum: [DISUSE, DISPOSED]
        - name: page
          required: false
          in: query
          schema:
            type: integer
            example: 0
        - name: size
          required: false
          in: query
          schema:
            type: integer
            example: 20
        - name: sort
          required: false
          in: query
          description: "\"필드,방향\" 형식 (예: assetName,asc)"
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisposalAssetPageResponseDto"
  ##########################
  # AssetCategory
  ##########################
  /asset-category:
    get:
      tags:
        - AssetCategory
      summary: 자산 종류 목록 조회
      operationId: searchAllAssetCategory
      description: 자산 종류 목록을 조회합니다.
      parameters:
        - name: keyword
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetCategoryResponseDto'
    post:
      tags:
        - AssetCategory
      summary: 자산 종류 등록
      operationId: registerAssetCategory
      description: 자산 종류를 등록합니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCategoryRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCategoryIdResponseDto"
  /asset-category/{categoryId}:
    get:
      tags:
        - AssetCategory
      summary: 자산 종류 상세 조회
      operationId: searchAssetCategory
      description: 자산 종류의 상세정보를 조회합니다.
      parameters:
        - name: categoryId
          in: path
          description: 자산 종류 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategoryResponseDto'
    patch:
      tags:
        - AssetCategory
      summary: 자산 종류 수정
      operationId: modifyAssetCategory
      description: 자산 종류를 수정합니다. (종류 코드는 수정 불가)
      parameters:
        - name: categoryId
          in: path
          description: 자산 종류 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCategoryModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCategoryIdResponseDto"
    delete:
      tags:
        - AssetCategory
      summary: 자산 종류 삭제
      operationId: removeAssetCategory
      description: 자산 종류를 삭제(사용 해제)합니다. 기본 제공 4종은 삭제할 수 없습니다.
      parameters:
        - name: categoryId
          in: path
          description: 자산 종류 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  ##########################
  # AssetLocation
  ##########################
  /asset-location:
    get:
      tags:
        - AssetLocation
      summary: 자산 위치 목록 조회
      operationId: searchAllAssetLocation
      description: 자산 위치 목록을 조회합니다.
      parameters:
        - name: keyword
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetLocationResponseDto'
    post:
      tags:
        - AssetLocation
      summary: 자산 위치 등록
      operationId: registerAssetLocation
      description: 자산 위치를 등록합니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLocationRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLocationIdResponseDto"
  /asset-location/{locationId}:
    get:
      tags:
        - AssetLocation
      summary: 자산 위치 상세 조회
      operationId: searchAssetLocation
      description: 자산 위치의 상세정보를 조회합니다.
      parameters:
        - name: locationId
          in: path
          description: 자산 위치 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLocationResponseDto'
    patch:
      tags:
        - AssetLocation
      summary: 자산 위치 수정
      operationId: modifyAssetLocation
      description: 자산 위치를 수정합니다.
      parameters:
        - name: locationId
          in: path
          description: 자산 위치 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLocationModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLocationIdResponseDto"
    delete:
      tags:
        - AssetLocation
      summary: 자산 위치 삭제
      operationId: removeAssetLocation
      description: 자산 위치를 삭제(사용 해제)합니다.
      parameters:
        - name: locationId
          in: path
          description: 자산 위치 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  ##########################
  # Inventory (S-300~306,308 전수조사 - 관리자 화면. 임직원 모바일 검수 S-310/311은 별도 구현)
  ##########################
  /inventory:
    get:
      tags:
        - Inventory
      summary: 전수조사 목록
      operationId: searchAllInventory
      description: 전수조사 목록을 조회합니다. (S-300)
      parameters:
        - name: page
          required: false
          in: query
          schema:
            type: integer
            example: 0
        - name: size
          required: false
          in: query
          schema:
            type: integer
            example: 20
        - name: sort
          required: false
          in: query
          description: "\"필드,방향\" 형식 (예: title,asc)"
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPageResponseDto"
  /inventory/{inventoryId}:
    get:
      tags:
        - Inventory
      summary: 전수조사 상세
      operationId: searchInventory
      description: 전수조사 1건의 요약 정보를 조회합니다.
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponseDto"
  /inventory/member/preview:
    post:
      tags:
        - Inventory
      summary: 전수조사 생성(임직원형) 대상 미리보기
      operationId: previewMemberInventory
      description: 실제로 생성하지 않고, 제외 인원을 반영한 대상 자산·참여자 수를 미리 계산합니다. (S-301)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMemberPreviewRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPreviewResponseDto"
  /inventory/member:
    post:
      tags:
        - Inventory
      summary: 전수조사 생성(임직원형)
      operationId: registerMemberInventory
      description: 개인배정 자산을 대상으로 전수조사를 생성합니다. 대상은 생성 시점에 스냅샷으로 고정됩니다(I1). (S-301)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMemberCreateRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryIdResponseDto"
  /inventory/admin/preview:
    get:
      tags:
        - Inventory
      summary: 전수조사 생성(관리자형) 대상 미리보기
      operationId: previewAdminInventory
      description: 공용·미배정 자산 기준 대상 자산 수를 미리 계산합니다. (S-302)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPreviewResponseDto"
  /inventory/admin:
    post:
      tags:
        - Inventory
      summary: 전수조사 생성(관리자형)
      operationId: registerAdminInventory
      description: 공용·미배정 자산을 대상으로, 지정한 검수자 풀이 검수하는 전수조사를 생성합니다. (S-302, Q-32)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdminCreateRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryIdResponseDto"
  /inventory/{inventoryId}/progress:
    get:
      tags:
        - Inventory
      summary: 전수조사 진행 현황
      operationId: searchInventoryProgress
      description: 확인완료/승인대기/이상/미확인 4개 지표와 참여자별 분해를 조회합니다. (S-303)
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryProgressResponseDto"
  /inventory/{inventoryId}/results:
    get:
      tags:
        - Inventory
      summary: 전수조사 검수 결과 목록
      operationId: searchInventoryResults
      description: 자산별/이상보고 탭(S-303), 검수 승인·반려(S-304), 종결 처리(S-308)가 함께 쓰는 목록입니다.
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
        - name: status
          required: false
          in: query
          description: UNCONFIRMED/PENDING_APPROVAL/CONFIRMED/ANOMALY - 비우면 전체
          schema:
            type: string
            enum: [UNCONFIRMED, PENDING_APPROVAL, CONFIRMED, ANOMALY]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryResultRowResponseDto"
  /inventory/{inventoryId}/report:
    get:
      tags:
        - Inventory
      summary: 전수조사 리포트
      operationId: searchInventoryReport
      description: 4개 지표·참여자별 분해·미확인 처리 내역(핵심 섹션)·분실 목록·이상 유형 분해를 조회합니다. (S-305, 진행중/종료 모두 조회 가능)
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReportResponseDto"
  /inventory/schedules:
    get:
      tags:
        - Inventory
      summary: 반복 시행 스케줄
      operationId: searchInventorySchedules
      description: 유형(임직원형/관리자형)별 최근 종료된 조사 기준 다음 시행 예정일을 조회합니다. (S-306. 자동 실행은 미구현 - 알림 인프라 부재)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryScheduleResponseDto"
  /inventory/{inventoryId}/clone-template:
    get:
      tags:
        - Inventory
      summary: 템플릿 복제용 설정 조회
      operationId: searchInventoryCloneTemplate
      description: 선택한 조사의 생성 옵션(대상 자산은 제외)을 그대로 읽어 새 생성 다이얼로그를 미리 채우는 데 씁니다. (S-306)
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCloneTemplateResponseDto"
