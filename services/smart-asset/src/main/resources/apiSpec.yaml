      operationId: selfConfirmInventoryResult
      description: 임직원 본인이 QR 연속 스캔으로 확인 처리합니다. 본인 소유 대상만 허용됩니다(소유권 검사). (S-311)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
