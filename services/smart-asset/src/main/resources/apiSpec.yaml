    patch:
      tags:
        - Inventory
      summary: 전수조사 종료 확정
      operationId: closeInventory
      description: 미확인 항목 중 종결 처리가 안 된 것이 남아있으면 실패합니다(강제 관문, S-308).
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
