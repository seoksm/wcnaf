    patch:
      tags:
        - Inventory
      summary: 제 자산이 아닙니다
      operationId: selfReportWrongHolder
      description: 본인 소유 대상에 대해 타인보유(WRONG_HOLDER) 이상을 보고합니다. (S-311)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryResultAnomalyNoteRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  ##########################
  # ProcessConfig
  ##########################
  /process-config:
    get:
      tags:
        - ProcessConfig
      summary: 프로세스 설정 조회
      operationId: searchProcessConfig
      description: 대여/수령·반납 프로세스 On-Off와 부속 정책을 조회합니다. 워크스페이스당 단일 행. (S-400)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessConfigResponseDto'
    patch:
      tags:
        - ProcessConfig
      summary: 프로세스 설정 수정
      operationId: modifyProcessConfig
      description: 대여/수령·반납 프로세스 On-Off와 부속 정책을 수정합니다. (S-400)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessConfigModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  ##########################
  # Loan
  ##########################
  /loan:
    get:
      tags:
        - Loan
      summary: 대여 현황 목록 조회
      operationId: searchAllLoan
      description: 대여 현황을 조회합니다. status를 지정하지 않으면 전체를 조회합니다. (S-410)
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, ACTIVE, RETURNED, REJECTED]
        - name: page
          required: false
          in: query
          schema:
            type: integer
        - name: size
          required: false
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPageResponseDto'
    post:
      tags:
        - Loan
      summary: 대여 처리 (관리자 대행)
      operationId: registerLoanByAdmin
      description: 관리자가 대여자를 직접 지정해 대여를 시작합니다. L4(연체 차단)·Q-42(동시대여 한도)를 검사합니다. (S-412)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRegisterByAdminRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanIdResponseDto"
  /loan/pending:
    get:
      tags:
        - Loan
      summary: 대여 승인대기 목록 조회
      operationId: searchAllPendingLoan
      description: Q-39 승인 옵션이 켜져 있을 때 승인을 기다리는 대여 목록을 조회합니다. (S-411)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponseDto'
  /loan/{loanId}/approve:
    patch:
      tags:
        - Loan
      summary: 대여 승인
      operationId: approveLoan
      description: 승인대기 상태의 대여를 승인해 대여중으로 전환합니다. (S-411)
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /loan/{loanId}/reject:
    patch:
      tags:
        - Loan
      summary: 대여 반려
      operationId: rejectLoan
      description: 승인대기 상태의 대여를 반려합니다. 자산은 다시 대여가능 상태로 돌아갑니다. (S-411)
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRejectRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /loan/self:
    post:
      tags:
        - Loan
      summary: QR 스캔 대여 (임직원 본인)
      operationId: registerLoanBySelf
      description: 로그인한 본인이 QR 스캔으로 대여를 시작합니다. 소유권과 무관하게 로그인 사용자 기준으로 처리됩니다. (S-420)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRegisterBySelfRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanIdResponseDto"
  /loan/my:
    get:
      tags:
        - Loan
      summary: 내 대여 자산 조회
      operationId: searchMyLoan
      description: 로그인한 본인의 전체 대여 이력(진행 중 + 반납완료)을 조회합니다. (S-421)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponseDto'
  /loan/available:
