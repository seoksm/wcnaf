      operationId: approveInventoryResult
      description: 승인대기 상태를 확인완료로 전환합니다. (S-304)
      parameters:
        - name: inventoryTargetId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /inventory-result/{inventoryTargetId}/reject:
    patch:
      tags:
        - Inventory
