      operationId: searchDashboardSummary
      description: 위젯 10종 데이터를 한 번에 계산해 돌려줍니다. 캐시 없이 매 요청 실시간 집계입니다. (S-700)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponseDto'
  /dashboard/widget-config:
    get:
      tags:
        - Dashboard
      summary: 위젯 설정 조회
      operationId: searchDashboardWidgetConfig
      description: 로그인 사용자의 위젯 표시여부·순서를 조회합니다. 저장된 값이 없는 위젯은 기본값(표시함)으로 채워 돌아옵니다. (S-701)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardWidgetConfigDto'
    patch:
      tags:
        - Dashboard
      summary: 위젯 설정 저장
      operationId: modifyDashboardWidgetConfig
      description: 위젯 10종 전체 목록을 받아 로그인 사용자의 설정을 통째로 교체합니다. (S-701)
        PUT이 아니라 PATCH를 쓰는 이유 - API 게이트웨이의 AuthorizationFilter는
        GET/POST/PATCH/DELETE만 authType(SELECT/INSERT/UPDATE/DELETE)으로 매핑하고
        PUT은 인식하지 못해 항상 미인가로 거부한다(services/api-gateway/.../AuthorizationFilter.java
        getAuthType()). 이 프로젝트의 다른 모든 수정 API도 PATCH를 쓴다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardWidgetConfigListRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
components:
  schemas:
    UUID:
      type: string
      format: UUID
      example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b

    ##########################
    # AssetCategory DTO 목록
    ##########################
    AssetCategoryResponseDto:
      type: object
      properties:
        categoryId:
