      description: PURCHASE 유형은 자산 등록 필드가 필요합니다(자산 생성→요청자 배정→수령확인서 요청 연쇄 처리, Q-49). RETURN 유형은 라이선스 배정을 회수합니다. 완료 후에는 잠금됩니다. (S-602)
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
