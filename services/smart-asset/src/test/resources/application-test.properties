#-----------------------------------------------------------------------
# 테스트 전용 프로필 (build.gradle의 test { environment "ACTIVE", "local,test" }로 활성화됨).
# application-local.properties 위에 겹쳐 적용되어, 운영/로컬 실행에는 전혀 영향을 주지 않는다.
# 여기 있는 값은 전부 테스트 전용 더미이며 실제 운영 키를 재사용하지 않는다.
#-----------------------------------------------------------------------

# 유형자산 엑셀 업서트(S-213) preview 서명 키 - @SpringBootTest가 ExcelRowSignerImpl 빈을 만들 때
# 쓰인다. 운영 키와 무관한, 이 저장소에 커밋해도 안전한 테스트 전용 값이다(최소 32바이트 이상).
winitech.smart-asset.excel-upsert.signing-key=integration-test-only-signing-key-do-not-use-elsewhere

# 아래 세 값은 common의 WiniSecurity / CommonAuthorizationRequestInterceptor / CommonEncServiceImpl이
# @SpringBootTest 기동 시 요구하는 필수 시크릿이다(미설정/짧으면 기동 자체가 실패함, 운영 키를
# default-application.properties에 평문으로 두던 과거 방식에서 환경변수 주입 방식으로 전환했다).
# 전부 이 테스트만을 위해 새로 생성한 더미 값으로, 운영 키와 무관하며 이 저장소에 커밋해도 안전하다.
winitech.security.jwt.secret=M+rg/61MGOpTM7o4MCz8L5mB3pHRuDSXu42qCv3Rsa5h/evmaaMw0xjqogi+wAu2
winitech.security.api-gateway.magic-header-secret=integration-test-only-magic-header-secret-do-not-use-elsewhere
winitech.enc.private.
