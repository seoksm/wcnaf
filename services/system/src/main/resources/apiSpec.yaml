openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: /api/v1/system
tags:
  - name: Menu
    description: 메뉴를 관리하는 API Controller
  - name: Menu Permission
    description: 메뉴의 권한을 관리하는 API Controller
  - name: Authorization Group User
    description: 권한 그룹 사용자를 관리하는 API Controller
  - name: Program
    description: 프로그램을 관리하는 API Controller
  - name: Program Action
    description: 프로그램의 액션을 관리하는 API Controller
  - name: Code
    description: 공통코드를 관리하는 API Controller
paths:
  ##########################
  # Menu   
  ##########################
  /menu:
    get:
      tags:
        - Menu
      summary: 메뉴 목록 조회
      operationId: searchAllMenu
      description: 모든 메뉴를 조회합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: '#/components/schemas/MenuResponseDto'
    post:
      tags:
        - Menu
      summary: 메뉴 등록
      operationId: registerMenu
      description: 단일 메뉴를 등록합니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuStoreResponseDto"
  /menu/{menuId}:
    get:
      tags:
        - Menu
      summary: 메뉴 상세 조회
      operationId: searchMenu
      description: 메뉴의 상세정보를 조회합니다.
      parameters:
        - name: menuId
          in: path
          description: 메뉴 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponseDto'
    patch:
      tags:
        - Menu
      summary: 메뉴 수정
      operationId: modifyMenu
      description: 단일 메뉴를 수정합니다.
      parameters:
      - name: menuId
        in: path
        description: 메뉴 ID
        required: true
        schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuStoreResponseDto"
    delete:
      tags:
        - Menu
      summary: 메뉴 삭제
      operationId: removeMenu
      description: 메뉴를 삭제합니다. (soft delete)
      parameters:
        - name: menuId
          in: path
          description: 메뉴 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
        - name: confirmYn
          in: query
          description: 삭제 확인 (Y일때만 삭제합니다. 실수 방지)
          required: true
          example: "N"
          schema:
            type: string
            enum: ["Y", "N"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /menu/tree:
    get:
      tags:
        - Menu
      summary: 메뉴 트리 조회
      operationId: searchMenuTree
      description: 모든 메뉴를 조회합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuTreeResponseDto'
  /menu/order:                
    patch:
      tags:
        - Menu
      summary: 메뉴 순서 저장
      operationId: modifyMenuOrder
      description: 메뉴 순서를 저장합니다.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MenuOrderModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  
  ##########################
  # Menu Permission   
  ##########################
  /user/{userId}/menu-permission/tree:
    get:
      tags:
        - Menu Permission
      summary: 사용자 메뉴 권한 목록 조회
      operationId: searchAllUserMenuPermission
      description: 사용자의 모든 메뉴 권한을 조회합니다.
      parameters:
        - name: userId
          in: path
          description: 사용자 ID
          required: true
          schema:
            type: string
            format: UUID
        - name: authorizationGroupId
          in: query
          description: 권한 그룹 ID. 값이 주어지지 않는 경우 전체 그룹에 대하여 병합하여 조회합니다.
          required: false
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuPermissionTreeResponseDto'
  /user/{userId}/menu/{menuId}/permission:
    get:
      tags:
        - Menu Permission
      summary: 사용자 메뉴 권한 조회
      operationId: searchUserMenuPermission
      description: 사용자의 메뉴 권한을 조회합니다.
      parameters:
        - name: userId
          in: path
          description: 사용자 ID
          required: true
          schema:
            type: string
            format: UUID
        - name: menuId
          in: path
          description: 메뉴 ID
          required: true
          schema:
              type: string
              format: UUID
        - name: authorizationGroupId
          in: query
          description: 권한 그룹 ID. 값이 주어지지 않는 경우 전체 그룹에 대하여 병합하여 조회합니다.
          required: false
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionDetailResponseDto'
  /authorization-group/{authorizationGroupId}/menu-permission:
    get:
      tags:
        - Menu Permission
      summary: 메뉴 권한 목록 조회
      operationId: searchAllMenuPermission
      description: 모든 메뉴 권한을 조회합니다. 권한이 있는 건만 조회합니다. (권한이 없는 메뉴도 조회하려면 /authorization-group/{authorizationGroupId}/menu-permission/tree API를 사용하세요.)
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
              type: string
              format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuPermissionResponseDto'
    post:
      tags:
        - Menu Permission
      summary: 메뉴 권한 등록
      operationId: registerMenuPermission
      description: 단일 메뉴 권한을 등록합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuPermissionRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuPermissionStoreResponseDto"
  /authorization-group/{authorizationGroupId}/menu-permission/{menuPermissionId}:
    get:
      tags:
        - Menu Permission
      summary: 메뉴 권한 상세 조회
      operationId: searchMenuPermission
      description: 메뉴 권한의 상세정보를 조회합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
              type: string
              format: UUID
              example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
        - name: menuPermissionId
          in: path
          description: 메뉴 권한 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionResponseDto'
    patch:
      tags:
        - Menu Permission
      summary: 메뉴 권한 수정
      operationId: modifyMenuPermission
      description: 단일 메뉴를 수정 권한합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
        - name: menuPermissionId
          in: path
          description: 메뉴 권한 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuPermissionModifyRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuPermissionStoreResponseDto"
    delete:
      tags:
        - Menu Permission
      summary: 메뉴 권한 삭제
      operationId: removeMenuPermission
      description: 메뉴를 삭제 권한합니다. (hard delete)
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
        - name: menuPermissionId
          in: path
          description: 메뉴 권한 ID
          required: true
          schema:
            type: string
            format: UUID
            example: 017b6b3b-1b3b-4b6b-8b3b-1b3b4b6b8b3b
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  /authorization-group/{authorizationGroupId}/menu-permission/tree:
    get:
      tags:
        - Menu Permission
      summary: 메뉴 권한 트리 조회  (메뉴 기준)
      operationId: searchMenuPermissionTree
      description: 모든 메뉴 권한을 조회합니다. 권한이 등록되어있지 않더라도 메뉴 기준으로 메뉴에 등록되어있으면 조회가 됩니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuPermissionTreeResponseDto'
  /authorization-group/{authorizationGroupId}/menu-permission/tree-list:
    get:
      tags:
        - Menu Permission
      summary: 메뉴 권한 트리 리스트로 조회  (메뉴 기준)
      operationId: searchMenuPermissionTreeList
      description: 모든 메뉴 권한을 트리구조의 리스트로 조회합니다. 권한이 등록되어있지 않더라도 메뉴 기준으로 메뉴에 등록되어있으면 조회가 됩니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
        - name: childrenMark
          in: query
          description: 자식 메뉴일때 이름 앞에 붙일 마크
          required: false          
          schema:
            type: string
            default: "└ "
        - name: padString
          in: query
          description: 자식 메뉴일때 이름 앞에 붙일 들여쓰기 문자열
          required: false          
          schema:
            type: string
            default: "&nbsp;"
        - name: padLength
          in: query
          description: 자식 메뉴일때 이름 앞에 붙일 들여쓰기 길이
          required: false          
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuPermissionTreeResponseDto'
  /authorization-group/{authorizationGroupId}/menu-permission/batch:
    post:
      tags:
        - Menu Permission
      summary: 메뉴 권한 일괄 등록
      operationId: registerMenuPermissionBatch
      description: 메뉴 권한을 일괄로 저장합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuPermissionBatchRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuPermissionBatchStoreResponseDto"
  /authorization-group/menu-permission/syncAll:
    get:
      tags:
        - Menu Permission
      summary: 메뉴 권한 전체 동기화
      operationId: syncAllAuthorizationGroupPermission
      description: 메뉴 권한을 전체 동기화합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
  
  ##########################
  # Authorization Group User
  ##########################
  /authorization-group/{authorizationGroupId}/user:
    get:
      tags:
        - Authorization Group User
      summary: 권한 그룹 사용자 목록 조회
      operationId: searchAllAuthorizationGroupUser
      description: 권한 그룹에 속한 사용자 목록을 조회합니다. 권한 그룹에 속한 사용자만 조회됩니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: searchType
          in: query
          description: 검색 타입
          required: false
          schema:
            type: string
            enum: ["", USERNAME, FULL_NAME]
        - name: searchKeyword
          in: query
          description: 검색어
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 사용 여부
          required: false
          schema:
              type: string
              enum: [ENABLE, DISABLE]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationGroupUserResponseDto'
    post:
      tags:
        - Authorization Group User
      summary: 권한 그룹 사용자 등록
      operationId: registerAuthorizationGroupUser
      description: 권한 그룹 사용자를 등록합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationGroupUserRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationGroupUserStoreResponseDto"
  /authorization-group/{authorizationGroupId}/user/all:
    get:
      tags:
        - Authorization Group User
      summary: 전체 사용자 목록 조회
      operationId: searchAllAuthorizationGroupUserAll
      description: 전체 사용자 목록을 조회합니다. 권한 그룹에 속하지 않은 사용자도 조회됩니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: searchType
          in: query
          description: 검색 타입
          required: false
          schema:
            type: string
            enum: ["", USERNAME, FULL_NAME]
        - name: searchKeyword
          in: query
          description: 검색어
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 사용자 사용 여부
          required: false
          schema:
              type: string
              enum: [ENABLE, DISABLE]
        - name: authorizationGroupUserStatus
          in: query
          description: 권한 그룹 소속 여부
          required: false
          schema:
              type: string
              enum: [ENABLE, DISABLE]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationGroupUserDetailResponseDto'
  /authorization-group/{authorizationGroupId}/user/{userId}:
    get:
      tags:
        - Authorization Group User
      summary: 권한 그룹 사용자 조회
      operationId: searchAuthorizationGroupUser
      description: 권한 그룹 사용자를 조회합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
        - name: userId
          in: path
          description: 사용자 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationGroupUserResponseDto'
    delete:
      tags:
        - Authorization Group User
      summary: 권한 그룹 사용자 삭제
      operationId: removeAuthorizationGroupUser
      description: 권한 그룹 사용자를 삭제합니다. (hard delete)
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
        - name: userId
          in: path
          description: 사용자 ID
          required: true
          schema:
            type: string
            format: UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK
    # patch:
    #   tags:
    #     - Authorization Group User
    #   summary: 권한 그룹 사용자 수정  
    #  operationId: modifyAuthorizationGroupUser
    #  description: 권한 그룹 사용자를 수정합니다.
    #  parameters:
    #    - name: authorizationGroupId
    #      in: path
    #      description: 권한 그룹 ID
    #      required: true
    #      schema:
    #        type: string
    #        format: UUID
    #    - name: userId
    #      in: path
    #      description: 사용자 ID
    #      required: true
    #      schema:
    #        type: string
    #        format: UUID
    #  requestBody: 
    #    content: 
    #      application/json:
    #        schema:
    #          $ref: "#/components/schemas/AuthorizationGroupUserModifyRequestDto"
    #  responses:
    #    "200":
    #      description: OK
    #      content:
    #        application/json:
    #          schema:
    #            $ref: '#/components/schemas/AuthorizationGroupUserStoreResponseDto'
  /authorization-group/{authorizationGroupId}/user/batch:
    post:
      tags:
        - Authorization Group User
      summary: 권한 그룹 사용자 일괄 등록
      operationId: registerAuthorizationGroupUserBatch
      description: 권한 그룹 사용자를 일괄로 저장합니다.
      parameters:
        - name: authorizationGroupId
          in: path
          description: 권한 그룹 ID
          required: true
          schema:
            type: string
            format: UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationGroupUserBatchRegisterRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationGroupUserBatchStoreResponseDto"
  /authorization-group/user/syncAll:
    get:
      tags:
        - Authorization Group User
      summary: 전체 권한 그룹 사용자 정보 동기화
      operationId: syncAllAuthorizationGroupUser
      description: 전체 권한 그룹 사용자 정보 동기화합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: OK

  ##########################
  # Program   
  ##########################
  /program:
    get:
      tags:
        - Program
      summary: 프로그램 목록 조회
      operationId: searchAllProgram
      description: 모든 프로그램을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: searchType
          in: query
          description: 검색 타입
          required: false
          schema:
            type: string
            enum: ["", PROGRAM_NAME, PROGRAM_CODE]
        - name: searchKeyword
          in: query
          description: 검색어
          required: false
          schema:
            type: string
        - name: MenuStatus
          in: query
          description: 메뉴 사용 여부
          required: false
          schema:
              type: string
              enum: [ENABLE, DISABLE]
