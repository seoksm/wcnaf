server.port = ${WINI-PORT:8092}

#-----------------------------------------------------------------------
# DB 접속정보 설정
#-----------------------------------------------------------------------
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:log4jdbc:postgresql://postgres:5432/system
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.hikari.maximum-pool-size=3

#-----------------------------------------------------------------------
# JPA 설정
#-----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=false
spring.jpa.properties.hibernate.format_sql=true

#-----------------------------------------------------------------------
# Kafka 설정
#-----------------------------------------------------------------------
spring.kafka.bootstrap-servers=kafka:29092

#-----------------------------------------------------------------------
# 보안 설정
#-----------------------------------------------------------------------
winitech.security.use-restapi-encryption=false

#-----------------------------------------------------------------------
# Mybatis 설정
#-----------------------------------------------------------------------
winitech.mybatis.use-auto-mapper-refresh=false

#-----------------------------------------------------------------------
# 기타 설정
#----------------------------------------------------------------------- 
spring.jackson.serialization.INDENT_OUTPUT = true

winitech.devmode = false
# winitech.devmode.login.skip-login = true
# winitech.devmode.login.skip-login-jwt-token = Bearer eyJ...
# winitech.devmode.login.skip-login-org-id = 0b5b90f5...

winitech.security.authorization.mode = api-gateway

#-----------------------------------------------------------------------
# 로그 설정
#-----------------------------------------------------------------------
winitech.log.show-stacktrace = true
winitech.log.show-full-stacktrace = false

#-----------------------------------------------------------------------
# S3 설정
#-----------------------------------------------------------------------
cloud.aws.credentials.accessKey=devlocal
cloud.aws.credentials.secretKey=devlocal
cloud.aws.s3.bucket=devlocal
cloud.aws.s3.customEndpoint=http://192.168.15.80:29000
cloud.aws.region.static=eu-central-1
cloud.aws.stack.auto-=false

#-----------------------------------------------------------------------
# Quartz 설정
#-----------------------------------------------------------------------
## -- 1. Internal Database
## Quartz 자동 시작 여부
#spring.quartz.auto-startup = true
## Quartz 작업 스케쥴러 저장소 : jdbc (물리테이블 생성), memory
#spring.quartz.job-store-type = memory
## Quartz 관련 테이블 초기화 여부 : always (매번 초기화), never (초기화 하지 않음), embedded (메모리에만 생성)
#spring.quartz.jdbc.initialize-schema = always

# -- 2. Postgresql
# Quartz 작업 스케쥴러 저장소 : jdbc (물리테이블 생성), memory
spring.quartz.job-store-type = jdbc
# Quartz 관련 테이블 초기화 여부 : always (매번 초기화), never (초기화 하지 않음), embedded (메모리에만 생성)
spring.quartz.jdbc.initialize-schema = never

# 테이블 생성시 테이블명 접두사
spring.quartz.properties.org.quartz.jobStore.tablePrefix=qrtz_
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

# 클러스터 설정
spring.quartz.properties.org.quartz.scheduler.instanceId = AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered = true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval = 10000

#-----------------------------------------------------------------------
# Flyway 설정
#-----------------------------------------------------------------------
# Flyway 활성화
spring.flyway.enabled=true
# 기존 DB에 Flyway를 처음 적용할 때 사용 (flyway_schema_history 테이블이 없어도 baseline 생성)
spring.flyway.baseline-on-migrate=true
# Baseline 버전 (기존 스키마를 V0로 간주)
spring.flyway.baseline-version=0
# Migration 파일 위치
spring.flyway.locations=classpath:db/migration,classpath:db/seed

#-----------------------------------------------------------------------
# 파일업로드 설정
#-----------------------------------------------------------------------
winitech.file.tmp-zip-dir=/tmp